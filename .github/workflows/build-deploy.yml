# Reusable: build, price, bundle, ENCRYPT and deploy to GitHub Pages (SPEC §7).
# Called by deploy.yml and prices.yml only. This repo is public, so its logs are
# public: no step prints data, symbols or counts (Q35), and nothing from _data/
# or quotes.json is ever uploaded except inside the encrypted dist.
name: build-deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Back-to-back imports and price runs queue here; a newer pending run replaces an older pending one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check secrets
        env:
          TRADE_HISTORY_DEPLOY_KEY: ${{ secrets.TRADE_HISTORY_DEPLOY_KEY }}
          PLAYBOOK_DEPLOY_KEY: ${{ secrets.PLAYBOOK_DEPLOY_KEY }}
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$TRADE_HISTORY_DEPLOY_KEY" ] || missing="$missing TRADE_HISTORY_DEPLOY_KEY"
          [ -n "$PLAYBOOK_DEPLOY_KEY" ] || missing="$missing PLAYBOOK_DEPLOY_KEY"
          [ -n "$SITE_PASSPHRASE" ] || missing="$missing SITE_PASSPHRASE"
          if [ -n "$missing" ]; then echo "::error::Missing Actions secret(s):$missing"; exit 1; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tests run on synthetic fixtures before any private data is checked out.
      - run: npm test

      # lykam.github.io is shared by every Pages site of the account, and the owner's
      # browser keeps the site key there: no other repo may serve Pages (SPEC §8, Q48).
      - name: Check no other repo serves GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run pages-guard

      # The public demo (synthetic data, Q51): built and checked here, before any private
      # data is on disk and without SITE_PASSPHRASE in its environment. A broken demo fails
      # the deploy. It is copied into dist/demo/ after the main build below.
      - name: Build the public demo
        env:
          TJ_PUBLIC_LOG: "1"
        run: npm run build:demo

      # Read-only deploy keys, one per private repo (Q37).
      - name: Check out trade-history (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lykam/trade-history
          ssh-key: ${{ secrets.TRADE_HISTORY_DEPLOY_KEY }}
          path: _data/trade-history
          persist-credentials: false

      - name: Check out Playbook (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Lykam/Playbook
          ssh-key: ${{ secrets.PLAYBOOK_DEPLOY_KEY }}
          path: _data/Playbook
          persist-credentials: false

      - name: Restore previous quotes (encrypted cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _cache/quotes-cache.enc
          key: quotes-${{ github.run_id }}
          restore-keys: quotes-

      - name: Build, price, encrypt, check
        env:
          # Public logs: scripts print outcomes only, no counts (Q35).
          TJ_PUBLIC_LOG: "1"
          TRADE_HISTORY_DIR: ${{ github.workspace }}/_data/trade-history
          PLAYBOOK_DIR: ${{ github.workspace }}/_data/Playbook
          QUOTES_FILE: ${{ github.workspace }}/_data/quotes.json
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
        run: |
          mkdir -p _cache
          npm run quotes:cache -- restore --cache _cache/quotes-cache.enc
          npm run build
          # A failed fetch keeps the previous quotes, marked stale; it never blocks the deploy.
          npm run quotes || echo "quotes: fetch failed; deploying without fresh prices"
          npm run quotes:cache -- save --cache _cache/quotes-cache.enc
          npm run encrypt
          # The demo built before the private checkout; check:dist allows only its app shell under demo/.
          cp -r dist-demo dist/demo
          npm run check:dist -- --encrypted
          rm -rf _data

      - name: Save quotes (encrypted cache)
        if: hashFiles('_cache/quotes-cache.enc') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _cache/quotes-cache.enc
          key: quotes-${{ github.run_id }}

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
